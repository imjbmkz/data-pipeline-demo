version: 2

models:
  - name: stg_yellow_tripdata
    description: Raw trips with clean names and types. Not filtered; see quality.trips_checked.
    columns:
      - name: trip_id
        description: Hash of the record's fields. Duplicate records share an ID.
        data_tests: [not_null, unique]
      - name: pickup_at
        data_tests: [not_null]
      - name: dropoff_at
        data_tests: [not_null]

  - name: stg_taxi_zone_lookup
    columns:
      - name: location_id
        data_tests: [unique, not_null]

  - name: stg_taxi_zones
    columns:
      - name: location_id
        data_tests: [not_null]
